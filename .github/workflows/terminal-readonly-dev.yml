name: Terminal read-only DEV tests

on:
  push:
    branches:
      - dev/terminal-readonly-20261108
  pull_request:
    branches:
      - dev/autopilot-quota-guard-20261108
    paths:
      - 'terminal_readonly.py'
      - 'mcp_server.py'
      - 'tests/test_terminal_readonly.py'
      - 'tests/test_bootstrap_terminal.py'
      - 'tools/bootstrap_terminal_readonly.py'
      - '.github/workflows/terminal-readonly-dev.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Static syntax validation
        run: python -m py_compile terminal_readonly.py mcp_server.py tests/test_terminal_readonly.py tools/bootstrap_terminal_readonly.py tests/test_bootstrap_terminal.py
      - name: Read-only terminal unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_terminal_readonly.py' -v
      - name: Bootstrap offline unit tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_bootstrap_terminal.py' -v
