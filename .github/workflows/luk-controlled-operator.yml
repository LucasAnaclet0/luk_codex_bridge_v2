name: LUK controlled operator offline security checks

on:
  push:
    branches: [dev/luk-terminal-controlled-ops-20261110]
  pull_request:
    paths:
      - "luk_remote_operator_v1.py"
      - "tools/bootstrap_luk_controlled_operator.py"
      - "tests/test_luk_remote_operator_v1.py"
      - ".github/workflows/luk-controlled-operator.yml"

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Static compile, scoped lifecycle and rollback tests
        run: |
          python - <<'PY'
          import ast
          for name in ('luk_remote_operator_v1.py', 'tools/bootstrap_luk_controlled_operator.py',
                       'tests/test_luk_remote_operator_v1.py'):
              ast.parse(open(name, encoding='utf-8').read(), filename=name)
          print('OPERATOR_AST_OK')
          PY
          python -m unittest discover -s tests -p 'test_luk_remote_operator_v1.py' -v
          sha256sum tools/bootstrap_luk_controlled_operator.py luk_remote_operator_v1.py
